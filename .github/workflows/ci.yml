name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # Dependency advisories change without our code changing.
    - cron: "17 5 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # The generated LayerZero config carries signing-critical address tables, and the
  # repository's guidance is to regenerate rather than hand-edit them. This reconciles each
  # file against its own provenance header so a hand-edited row count or a stripped header
  # fails the build. It needs no upstream checkout, unlike scripts/check-*-parity*.mjs,
  # which require PILLAR_AUDIT_ROOT - an upstream TypeScript checkout not distributed
  # with this repository - and therefore cannot run here.
  generated-config:
    name: generated config integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node scripts/check-generated-config-integrity.mjs
      - run: node scripts/build-acceptance-matrix.mjs --check

  build:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    env:
      # Full debug info for the workspace test build fills the hosted runner's disk.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace --locked
        env:
          READ_DOMAIN_ARTIFACT_DIR: ${{ runner.temp }}/pillar-read-domain-http
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: read-domain-http-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pillar-read-domain-http/
          if-no-files-found: warn
      - name: Release build used by the container image
        run: cargo build --locked --release -p pillar-cli --bin pillar

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read rust-version from the workspace manifest
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --workspace --locked --all-targets

  supply-chain:
    name: audit, deny, sbom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo install --locked cargo-audit@0.22.2 cargo-deny@0.20.2 cargo-cyclonedx@0.5.9
      - run: cargo audit
      - run: cargo deny check
      - name: Generate CycloneDX SBOM
        run: cargo cyclonedx --all --format json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: "**/*.cdx.json"
          if-no-files-found: error

  container:
    name: container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Capture checked-out source identity
        run: node scripts/ci-container-artifact.mjs prepare "$RUNNER_TEMP/pillar-image-artifact"
        env:
          GITHUB_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          GITHUB_PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the runtime image
        run: |
          out="$RUNNER_TEMP/pillar-image-artifact"
          TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST' > "$out/docker-build-started-at-kst.txt"
          set +e
          docker build \
            --build-arg PILLAR_IMAGE_VERSION=${GITHUB_SHA::12} \
            --build-arg VCS_REVISION=${GITHUB_SHA} \
            -t pillar-client:ci . > "$out/docker-build.log" 2>&1
          status=$?
          printf '%s\n' "$status" > "$out/docker-build-exit-status.txt"
          TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST' > "$out/docker-build-finished-at-kst.txt"
          set -e
          cat "$out/docker-build.log"
          exit "$status"
      - name: Save and identify the tested image
        run: |
          out="$RUNNER_TEMP/pillar-image-artifact"
          TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST' > "$out/save-identify-started-at-kst.txt"
          set +e
          (
            set -Eeuo pipefail
            docker image inspect pillar-client:ci > "$out/image-inspect.json"
            revision=$(docker image inspect pillar-client:ci \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
            test "$revision" = "$GITHUB_SHA"
            docker save --output "$out/pillar-client-ci.tar" pillar-client:ci
            test -s "$out/pillar-client-ci.tar"
            node scripts/ci-container-artifact.mjs finalize "$out"
          ) > "$out/save-identify.log" 2>&1
          status=$?
          printf '%s\n' "$status" > "$out/save-identify-exit-status.txt"
          TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST' > "$out/save-identify-finished-at-kst.txt"
          set -e
          cat "$out/save-identify.log"
          exit "$status"
        env:
          GITHUB_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          GITHUB_PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}

      - name: Refuse to start without required configuration
        run: |
          out="$RUNNER_TEMP/pillar-image-artifact"
          TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST' > "$out/container-preflight-started-at-kst.txt"
          set +e
          docker run --rm pillar-client:ci > "$out/container-preflight.log" 2>&1
          status=$?
          printf '%s\n' "$status" > "$out/container-preflight-exit-status.txt"
          TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST' > "$out/container-preflight-finished-at-kst.txt"
          set -e
          cat "$out/container-preflight.log"
          if grep -q "Missing required environment variable" "$out/container-preflight.log"; then
            message_observed=true
          else
            message_observed=false
          fi
          if [[ "$status" -ne 0 && "$message_observed" == true ]]; then
            step_passed=true
          else
            step_passed=false
          fi
          printf '{"actualExitStatus":%s,"missingConfigMessageObserved":%s,"stepPassed":%s}\n' \
            "$status" "$message_observed" "$step_passed" > "$out/container-preflight-result.json"
          test "$step_passed" = true
      - name: Finalize image diagnostics report
        if: always()
        run: node scripts/ci-container-artifact.mjs report "$RUNNER_TEMP/pillar-image-artifact"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pillar-ci-image-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pillar-image-artifact/
          if-no-files-found: error
          retention-days: 14
  macos-ton-release:
    name: macOS TON release lifecycle
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run exact TON release lifecycle and capture resources
        run: bash scripts/ci-ton-release-gate.sh
        env:
          CI_TON_ARTIFACT_DIR: ${{ runner.temp }}/pillar-ton-release-gate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: macos-ton-release-${{ github.sha }}
          path: ${{ runner.temp }}/pillar-ton-release-gate/
          if-no-files-found: error
