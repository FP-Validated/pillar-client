name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # Dependency advisories change without our code changing.
    - cron: "17 5 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # The generated LayerZero config carries signing-critical address tables, and the
  # repository's guidance is to regenerate rather than hand-edit them. This reconciles each
  # file against its own provenance header so a hand-edited row count or a stripped header
  # fails the build. It needs no upstream checkout, unlike scripts/check-*-parity*.mjs and
  # scripts/check-parity-coverage.mjs, which both require PILLAR_AUDIT_ROOT - the private
  # TypeScript service - and therefore cannot run here.
  generated-config:
    name: generated config integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node scripts/check-generated-config-integrity.mjs

  build:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace --locked
      - name: Release build used by the container image
        run: cargo build --locked --release -p pillar-cli --bin pillar

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version from the workspace manifest
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked --all-targets

  supply-chain:
    name: audit, deny, sbom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked cargo-audit cargo-deny cargo-cyclonedx
      - run: cargo audit
      - run: cargo deny check
      - name: Generate CycloneDX SBOM
        run: cargo cyclonedx --all --format json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: "**/*.cdx.json"
          if-no-files-found: error

  container:
    name: container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the runtime image
        run: |
          docker build \
            --build-arg PILLAR_IMAGE_VERSION=${GITHUB_SHA::12} \
            --build-arg VCS_REVISION=${GITHUB_SHA} \
            -t pillar-client:ci .
      - name: Image records the commit it was built from
        run: |
          revision=$(docker image inspect pillar-client:ci \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          test "$revision" = "$GITHUB_SHA"
      - name: Refuse to start without required configuration
        run: |
          set +e
          output=$(docker run --rm pillar-client:ci 2>&1)
          status=$?
          set -e
          echo "$output"
          test "$status" -ne 0
          echo "$output" | grep -q "Missing required environment variable"
