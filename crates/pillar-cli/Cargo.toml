[package]
name = "pillar-cli"
description = "Server binary for the Pillar LayerZero DVN client."
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
axum.workspace = true
hyper.workspace = true
hyper-util.workspace = true
pillar-api = { path = "../pillar-api" }
pillar-config = { path = "../pillar-config" }
pillar-runtime = { path = "../pillar-runtime" }
anyhow.workspace = true
tokio.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# The connection-ceiling test drives tokio's clock directly. Without this the
# test only compiles when another crate in the graph happens to enable the
# feature, so `cargo test -p pillar-cli` alone would fail.
tokio = { workspace = true, features = ["test-util"] }

[[bin]]
name = "pillar"
path = "src/main.rs"
