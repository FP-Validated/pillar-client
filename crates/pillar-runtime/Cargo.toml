[package]
name = "pillar-runtime"
description = "Composition root wiring configuration, providers, LayerZero, validation and signing for the Pillar DVN client."
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
aws-config.workspace = true
aws-sdk-kms.workspace = true
aws-sdk-lambda.workspace = true
aws-sdk-s3.workspace = true
aws-sdk-secretsmanager.workspace = true
azure_core.workspace = true
azure_identity.workspace = true
azure_security_keyvault_keys.workspace = true
base64.workspace = true
bech32.workspace = true
bs58.workspace = true
bytes.workspace = true
futures.workspace = true
percent-encoding = "2"
pillar-api = { path = "../pillar-api" }
pillar-config = { path = "../pillar-config" }
pillar-core = { path = "../pillar-core" }
pillar-metrics = { path = "../pillar-metrics" }
pillar-layerzero = { path = "../pillar-layerzero" }
ton_core.workspace = true
pillar-signer = { path = "../pillar-signer" }
google-cloud-storage.workspace = true
hex.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client"] }
hyper-util = { workspace = true, features = ["client-legacy", "client-proxy", "client-proxy-system"] }
hyper-rustls.workspace = true
indexmap.workspace = true
num-bigint.workspace = true
k256.workspace = true
reqwest.workspace = true
url.workspace = true
ripemd.workspace = true
serde.workspace = true
sha2.workspace = true
sha3.workspace = true
serde_json.workspace = true
serde_stacker.workspace = true
starknet-types-core.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tower.workspace = true
tracing.workspace = true
zeroize.workspace = true
tokio-postgres.workspace = true
tokio-postgres-rustls.workspace = true
rustls.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
pillar-client = { path = "../pillar-client" }
pillar-signer = { path = "../pillar-signer", features = ["test-support"] }
pillar-config = { path = "../pillar-config", features = ["test-support"] }
axum.workspace = true
url.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
# `tokio::time::advance` for the provider-config age tests: paused-clock only,
# never compiled into the binary.
tokio = { workspace = true, features = ["test-util"] }
